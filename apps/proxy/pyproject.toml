[project]
name = "sentinex-proxy"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sentinex-core",
  "mitmproxy>=10.3",
  "redis[hiredis]>=5.0",
  "structlog>=24.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinex_proxy"]
