[project]
name = "sentinex-worker"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sentinex-core",
  "arq>=0.26",
  "docker>=7.0",
  "redis[hiredis]>=5.0",
  "structlog>=24.0",
  "pydantic-settings>=2.3",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinex_worker"]
