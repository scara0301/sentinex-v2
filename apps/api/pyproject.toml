[project]
name = "sentinex-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "sentinex-core",
  "fastapi>=0.111",
  "uvicorn[standard]>=0.30",
  "python-multipart>=0.0.9",
  "arq>=0.26",
  "redis[hiredis]>=5.0",
  "structlog>=24.0",
  "pydantic-settings>=2.3",
  "python-jose[cryptography]>=3.3",
  "passlib[bcrypt]>=1.7",
  "aiofiles>=23.0",
  "detect-secrets>=1.5",
]

[tool.uv.sources]
sentinex-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["sentinex_api"]
