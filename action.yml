name: "SENTINEX Agent Security Scan"
description: >
  Upload an AI agent bundle to a SENTINEX instance, run a sandboxed
  security scan, and fail the build when findings cross the configured
  severity or risk-score gate.
author: "SENTINEX"
branding:
  icon: "shield"
  color: "red"

inputs:
  api-url:
    description: "Base URL of the SENTINEX API (e.g. https://sentinex.example.com)"
    required: true
  api-key:
    description: "Workspace API key (store as a repository secret)"
    required: true
  workspace-id:
    description: "Workspace UUID"
    required: true
  agent-name:
    description: "Agent name to register the upload under"
    required: true
  bundle-path:
    description: "Path to the agent bundle (.py, .zip, .tar.gz)"
    required: true
  scenario-ids:
    description: "Comma-separated scenario UUIDs (empty = all builtin scenarios)"
    required: false
    default: ""
  fail-on-severity:
    description: "Fail if any finding is at or above this severity (critical|high|medium|low|never)"
    required: false
    default: "high"
  max-risk-score:
    description: "Fail if the final risk score exceeds this value (0-100, empty = no score gate)"
    required: false
    default: ""
  timeout-seconds:
    description: "Maximum time to wait for the scan to finish"
    required: false
    default: "900"

outputs:
  scan-id:
    description: "UUID of the scan"
    value: ${{ steps.scan.outputs.scan-id }}
  risk-score:
    description: "Final 0-100 risk score"
    value: ${{ steps.scan.outputs.risk-score }}
  grade:
    description: "Letter grade (A+..F)"
    value: ${{ steps.scan.outputs.grade }}
  findings-count:
    description: "Total number of findings"
    value: ${{ steps.scan.outputs.findings-count }}
  badge-url:
    description: "Embeddable SVG badge URL for this scan"
    value: ${{ steps.scan.outputs.badge-url }}

runs:
  using: "composite"
  steps:
    - id: scan
      shell: bash
      env:
        SENTINEX_API_URL: ${{ inputs.api-url }}
        SENTINEX_API_KEY: ${{ inputs.api-key }}
        SENTINEX_WORKSPACE_ID: ${{ inputs.workspace-id }}
        SENTINEX_AGENT_NAME: ${{ inputs.agent-name }}
        SENTINEX_BUNDLE_PATH: ${{ inputs.bundle-path }}
        SENTINEX_SCENARIO_IDS: ${{ inputs.scenario-ids }}
        SENTINEX_FAIL_ON_SEVERITY: ${{ inputs.fail-on-severity }}
        SENTINEX_MAX_RISK_SCORE: ${{ inputs.max-risk-score }}
        SENTINEX_TIMEOUT_SECONDS: ${{ inputs.timeout-seconds }}
      run: python3 "${{ github.action_path }}/action/sentinex_scan.py"
